<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="css/base/normalize.css">
  <link rel="stylesheet" href="css/main.css">
  
  <title>PLAN Event Portal</title>
</head>

<body class="page">

  <!-- ==========================================================
         Header
    =========================================================== -->

  <header class="hero">

    <div class="container">

      <section class="hero__layout">

        <!-- Navigation
                     layout/navbar.html -->

        <!-- Hero
                     sections/hero.html -->

      </section>

    </div>

  </header>

  <!-- ==========================================================
         Main
    =========================================================== -->

  <main>

    <!-- ======================================================
             Event Introduction
        ======================================================= -->

    <section class="section section--intro">

      <div class="container">

        <div class="grid grid--2">

          <!-- Summary
                         sections/summary.html -->

          <!-- Event Details / Agenda Preview
                         sections/agenda.html -->

        </div>

      </div>

    </section>

    <!-- ======================================================
             Event Highlights (Optional)
        ======================================================= -->

    <section class="section section--highlights">

      <div class="container">

        <!-- Highlights
                     sections/highlights.html -->

      </div>

    </section>

    <!-- ======================================================
             Speakers (Optional)
        ======================================================= -->

    <section class="section section--speakers">

      <div class="container">

        <!-- Speakers
                     sections/speakers.html -->

      </div>

    </section>

    <!-- ======================================================
             Schedule / Agenda (Optional)
        ======================================================= -->

    <section class="section section--agenda">

      <div class="container">

        <!-- Agenda
                     sections/agenda.html -->

      </div>

    </section>

    <!-- ======================================================
             Sponsors (Optional)
        ======================================================= -->

    <section class="section section--sponsors">

      <div class="container">

        <!-- Sponsors
                     sections/sponsors.html -->

      </div>

    </section>

    <!-- ======================================================
             Venue / Platform (Optional)
        ======================================================= -->

    <section class="section section--venue">

      <div class="container">

        <!-- Venue / Platform
                     sections/venue.html -->

      </div>

    </section>

    <!-- ======================================================
             Registration
        ======================================================= -->

    <section class="section section--registration">

      <div class="container">

        <div class="grid grid--2">

          <!-- Registration
                         sections/registration.html -->

          <!-- Attendee Panel
                         sections/attendee-panel.html -->

        </div>

      </div>

    </section>

    <!-- ======================================================
             Resources (Optional)
        ======================================================= -->

    <section class="section section--resources">

      <div class="container">

        <!-- Downloads / Links
                     sections/resources.html -->

      </div>

    </section>

    <!-- ======================================================
             Frequently Asked Questions (Optional)
        ======================================================= -->

    <section class="section section--faq">

      <div class="container">

        <!-- FAQ
                     sections/faq.html -->

      </div>

    </section>

    <!-- ======================================================
             Call To Action (Optional)
        ======================================================= -->

    <section class="section section--cta">

      <div class="container">

        <!-- CTA
                     sections/cta.html -->

      </div>

    </section>

  </main>

  <!-- ==========================================================
         Footer
    =========================================================== -->

  <footer class="bottom-bar">

    <div class="container flex items-center justify-between">

      <!-- Bottom Bar
                 layout/bottom-bar.html -->

    </div>

  </footer>

  <script type="module" src="js/app.js">
  </script>

</body>

</html>
